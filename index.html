const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(plain);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
  try {
    const html = await decrypt(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch {
    err.textContent = "Wrong password. Try again.";
    btn.disabled = false; btn.textContent = "Open";
  }
});
